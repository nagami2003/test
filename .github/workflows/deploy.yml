name: Deploy to Google Apps Script

# Apps Script へ自動デプロイするワークフロー。
# 事前に GitHub Secrets へ以下を登録してください:
#   CLASPRC_JSON  : ローカルで `clasp login` 後に生成される ~/.clasprc.json の中身
#   SCRIPT_ID     : 対象 Apps Script プロジェクトのスクリプトID
# どちらかが未設定の場合、デプロイ手順はスキップされます。

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Check secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.CLASPRC_JSON }}" ] && [ -n "${{ secrets.SCRIPT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLASPRC_JSON / SCRIPT_ID secrets が未設定のためデプロイをスキップします。"
          fi

      - name: Write clasp credentials
        if: steps.secrets.outputs.ready == 'true'
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Write .clasp.json
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo '{ "scriptId": "${{ secrets.SCRIPT_ID }}", "rootDir": "./src" }' > .clasp.json

      - name: Push to Apps Script
        if: steps.secrets.outputs.ready == 'true'
        run: clasp push --force
